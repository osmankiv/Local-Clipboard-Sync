name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          
      # 1. إنشاء هيكل الأندرويد تلقائياً
      - run: flutter create . --platforms=android --org com.osmankiv.localclipboardsync

      # 2. حقن صلاحيات الإنترنت والشبكة تلقائياً في ملف AndroidManifest.xml
      - name: Add Android Permissions
        run: |
          file="android/app/src/main/AndroidManifest.xml"
          python3 -c "
          with open('$file', 'r') as f:
              content = f.read()
          permissions = '''
              <uses-permission android:name=\"android.permission.INTERNET\"/>
              <uses-permission android:name=\"android.permission.ACCESS_WIFI_STATE\"/>
              <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/>
          '''
          content = content.replace('<application', permissions + '\n    <application')
          with open('$file', 'w') as f:
              f.write(content)
          "

      - run: flutter pub get
      - run: flutter build apk --release
      
      - uses: actions/upload-artifact@v4
        with:
          name: local-clipboard-sync-apk
          path: build/app/outputs/flutter-apk/app-release.apk