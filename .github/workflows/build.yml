name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          
      # أضف هذا السطر لتقوم أداة فلاتر بإنشاء مجلدات الأندرويد والملفات الناقصة تلقائياً
      - run: flutter create . --platforms=android --org com.osmankiv.localclipboardsync
      
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: local-clipboard-sync-apk
          path: build/app/outputs/flutter-apk/app-release.apk